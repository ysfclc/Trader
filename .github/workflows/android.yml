name: Android CI

on:
  push:
    branches: [main, "build/**", "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:

concurrency:
  group: trader-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare persistent Trader development signing key
        id: stable_signing
        env:
          TRADER_KEYSTORE_BASE64: ${{ secrets.TRADER_KEYSTORE_BASE64 }}
          TRADER_KEYSTORE_PASSWORD: ${{ secrets.TRADER_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$TRADER_KEYSTORE_BASE64" ] && [ -n "$TRADER_KEYSTORE_PASSWORD" ]; then
            echo "$TRADER_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/trader-upload.jks"
            keytool -list -keystore "$RUNNER_TEMP/trader-upload.jks" -storepass "$TRADER_KEYSTORE_PASSWORD" -alias trader-upload >/dev/null
            echo "path=$RUNNER_TEMP/trader-upload.jks" >> "$GITHUB_OUTPUT"
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Stable signing secrets are not configured; the APK will be CI-only."
          fi
      - name: Verify and build
        env:
          TRADER_KEYSTORE_PATH: ${{ steps.stable_signing.outputs.path }}
          TRADER_KEYSTORE_PASSWORD: ${{ secrets.TRADER_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon clean testDebugUnitTest assembleDebug lintDebug
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trader-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify APK package, signature and stable certificate
        env:
          STABLE_SIGNING_READY: ${{ steps.stable_signing.outputs.ready }}
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/36.0.0/apksigner verify --verbose "$APK"
          $ANDROID_HOME/build-tools/36.0.0/aapt dump badging "$APK" | grep "package: name='com.yusufculcu.trader.debug' versionCode='2' versionName='0.2.0-debug'"
          if [ "$STABLE_SIGNING_READY" = "true" ]; then
            CERT=$($ANDROID_HOME/build-tools/36.0.0/apksigner verify --print-certs "$APK" | awk '/certificate SHA-256 digest:/ {print $NF}' | tr -d ':' | tr '[:upper:]' '[:lower:]')
            test "$CERT" = "cac4f54035d70ee305be9cad2a44419e83929a6e806132011ffa0afa00fab1c6"
          fi
      - name: Upload persistent installable APK
        if: steps.stable_signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trader-installable-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Upload CI-only APK (not for installation)
        if: steps.stable_signing.outputs.ready != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trader-ci-debug-apk-not-for-installation
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
